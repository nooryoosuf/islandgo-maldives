<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IslandGo Maldives — Loading...</title>
    <script type="text/javascript">
      // SPA redirect script for GitHub Pages / static hosting.
      // Encodes path, search parameters and hash, redirecting to index.html
      // so deep URLs and tracking parameters are never lost on static servers.
      var l = window.location;
      var isProjectPage = l.hostname.indexOf('github.io') !== -1 && l.pathname.split('/').filter(Boolean).length > 1;
      var segments = isProjectPage ? 1 : 0;
      var basePath = l.pathname.split('/').slice(0, 1 + segments).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(segments).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (basePath.endsWith('/') ? basePath : basePath + '/') +
        '?p=/' + routePath.replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to destination...</p>
  </body>
</html>
